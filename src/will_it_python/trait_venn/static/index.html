<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trait Venn</title>
<meta name="description" content="Estimate how rare a person is from a combination of traits, with a Venn diagram of every intersection and expected head counts worldwide and by nation.">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<article class="page">
  <header class="band">
    <h1 class="hero" id="hero" aria-live="polite"></h1>
    <div class="pair">
      <p id="world-count"></p>
      <p>
        <span class="big" id="nation-count"></span>
        <label for="nation" class="muted">in</label>
        <select id="nation"></select>
        <span class="muted" id="nation-odds"></span>
      </p>
    </div>
    <p class="meta"><span id="selected-count"></span> <button type="button" class="linkbtn" id="clear">Clear all</button>
      · <button type="button" class="linkbtn" id="text-view" aria-pressed="false">Text view</button></p>
  </header>

  <main class="grid">
    <section class="col" aria-labelledby="conventional-h">
      <h2 id="conventional-h">Conventional</h2>
      <p class="note" id="conventional-note"></p>
      <div id="conventional"></div>
    </section>

    <section class="stage" aria-label="Venn diagram of selected traits">
      <div class="venn" id="venn"></div>
      <aside class="inspector" id="inspector" aria-live="polite"></aside>
      <!-- Text version of the result: shown by "Text view"; otherwise visually
           hidden with clipping (not display:none) so browser reader views and
           screen readers keep it. -->
      <section class="reader-summary" id="summary" aria-labelledby="summary-h">
        <h2 id="summary-h">Summary</h2>
        <div id="summary-body"></div>
      </section>
    </section>

    <section class="col" aria-labelledby="unconventional-h">
      <h2 id="unconventional-h">Less conventional</h2>
      <p class="note">Open a category to drill down</p>
      <div id="unconventional"></div>
    </section>
  </main>

  <footer class="src">
    <p id="sources"></p>
    <p>Traits assumed independent except where they depend on gender (color blindness, height, migraines).</p>
  </footer>
</article>
<script src="/static/app.js"></script>
</body>
</html>
